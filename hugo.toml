# The deploy workflow overrides baseURL with the real Pages URL, so this only
# matters for local builds. Update it when you add a custom domain.
baseURL = "https://seriozh1.github.io/"
locale = "en-US"
title = "Sergei Smirnov"
theme = "terminal"
# The hex string decodes to "aligned" (hover shows it).
copyright = '© Sergei Smirnov <span class="hexdump" title="aligned">61 6c 69 67 6e 65 64</span>'

enableRobotsTXT = true

[pagination]
  pagerSize = 10

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[params]
  # Section whose pages get prev/next links (content/writing/).
  contentTypeName = "writing"
  centerTheme = true
  fullWidthTheme = false
  showMenuItems = 4
  showLastUpdated = false
  readMore = "Read more"
  subtitle = "research engineer · ai safety"
  keywords = "AI safety, machine learning, research engineering"
  dateFormat = "2006-01-02"

  [params.logo]
    logoText = "Sergei Smirnov"
    logoHomeLink = "/"

[menus]
  [[menus.main]]
    name = "projects"
    url = "/projects/"
    weight = 10
  [[menus.main]]
    name = "publications"
    url = "/publications/"
    weight = 20
  [[menus.main]]
    name = "writing"
    url = "/writing/"
    weight = 30
