# Site settings only. What the page shows (including the order of sections, which also
# drives the top menu) is set in data/site.yaml; the items come from data/.

# The deploy workflow overrides baseURL with the real Pages URL, so this only
# matters for local builds. Update it when you add a custom domain.
baseURL = "https://seriozh1.github.io/"
locale = "en-US"
theme = "terminal"

enableRobotsTXT = true
# One-page site: no tag/category pages or RSS feed.
disableKinds = ["taxonomy", "term", "rss"]

# Allow raw HTML inside Markdown fields of the data files.
[markup.goldmark.renderer]
  unsafe = true

# ==text== in data fields renders as yellow text (<mark>), for key phrases.
[markup.goldmark.extensions.extras.mark]
  enable = true

[params]
  centerTheme = true
  fullWidthTheme = false
