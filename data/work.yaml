  - title: "Tracking the Cyber Capabilities of Cheap Open-Weight Models"
    url: "https://www.lesswrong.com/posts/tWrzaGMbzfX7eTdzZ/tracking-the-cyber-capabilities-of-cheap-open-weight-models"
    type: blog post
    venue: "LessWrong 2026"
    date: "2026-10-28"
    authors: "**S. Smirnov**, S. Lermen, kapedalex"
    summary: "Xiaomi's open-weight MiMo-V2.6-Pro has weak safety guardrails and is extremely cheap, yet ranked 3rd of 9 models on ExploitBench, behind only Mythos (preview) and GPT-5.5, at 30-60x lower cost than models it matched. Real-world offensive capability may exceed what benchmarks show: a hint from a stronger model unlocked much more capability, and the model exploited a recent PHP vulnerability to take over a test server."
    links:
      - { name: lesswrong, url: "https://www.lesswrong.com/posts/tWrzaGMbzfX7eTdzZ/tracking-the-cyber-capabilities-of-cheap-open-weight-models" }
      - { name: code, url: "https://github.com/seriozh1/mimo-exploitbench-eval" }

  - title: "Immersive Tailoring of Embodied Agents Using Large Language Models"
    url: "https://doi.org/10.1109/VR59515.2025.00063"
    type: paper
    venue: "IEEE VR 2025"
    date: "2025-03"
    authors: "A. Bellucci, G. Jacucci, K. D. Trung, P. K. Das, **S. Smirnov**, I. Ahmed, J.-L. Lugrin"
