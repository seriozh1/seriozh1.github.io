    date: "2025-07"

  - title: "Test Time Inverse Scaling Arises from Belief Entrenchment"
    type: preprint
    venue: "SPAR 2025"
    date: "2025-12"
    authors: "**S. Smirnov**, T. A. Qiu, Z. He"
    summary: "LLMs sometimes become less accurate when given more reasoning at test time. Across 8 models and 500 Metaculus forecasting questions with 0-10 rounds of reflection, longer reasoning increased belief entrenchment and forecasting error, and higher Martingale scores predicted worse Brier scores."

