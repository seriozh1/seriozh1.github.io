  - title: "AI Alignment Demands Better Emotion Recognition and Social Understanding Capabilities"
    type: paper
    venue: "ToM4AI Workshop at AAAI 2026"
    date: "2026"
    authors: "G. Jacucci, D. Kirsh, **S. Smirnov**, A. Bellucci, P. Marttinen"
    summary: "Position paper: trustworthy alignment needs genuine social understanding in multimodal foundation models, built on four capacities: epistemic humility, skin-in-the-game stakes, situated embodiment and sensitivity to personal meaning as a fourth affective dimension beyond valence, arousal and control."
    abstract: "Current multimodal foundation models (MFMs) excel at multimodal pattern recognition, yet their grasp of human social life remains shallow. This position paper argues that trustworthy AI alignment depends on genuine social understanding, which in turn requires four key capacities: (i) epistemic humility, (ii) skin-in-the-game stakes, (iii) situated embodiment, and (iv) sensitivity to personal meaning as a fourth affective dimension beyond valence, arousal, and control. We integrate results from cognitive neuroscience, psychology, and recent benchmark analyses to derive a suite of evaluative indices—Action Anchoring, Perspective Alignment, Interactive Synchrony, and Meaning Coherence—and lay out a research roadmap toward agents that participate, feel, and care."
    links:
      - { name: code, url: "https://github.com/seriozh1/ai-alignment-demands-emotions" }

  - title: "Extraction of the Semantic Relation between Words Based on the Analysis of the Word Embeddings with Neural Networks"
    url: "https://ssrn.com/abstract=4648600"
    type: paper
    venue: "SSRN preprint"
    date: "2023-11-29"
    authors: "V. Kaliteevskii, **S. Smirnov**, A. Ogurtsov"
    summary: "Expands a topic word set by finding the best relevance metric between a word and a set of words: a small neural network on fastText embeddings classifies words as thematic or not. Applications: patent and scientific-publication analysis, search, and extracting technology trends from large corpora."
    abstract: "The article discusses the use of word embeddings, numerical representations of a word's meaning, based on natural language processing (NLP) techniques. The pre-training of embeddings on large corpora has proven to be a useful technique for transferring generally applicable information to a wide range of downstream tasks in NLP. However, extracting the genuine meaning of a word from its embedding remains a challenge for machines. The article presents a new approach for expanding the set of words related to a specific topic by defining the best metric of relevancy between a specific word and a set of words. The problem addressed in the article is relevant to various contexts, including patent and scientific publication analysis, web search engines, and the extraction of technological trends from large corpora of scientific publications. The article also discusses various methods, including Latent Dirichlet Allocation, Latent Semantic Analysis, Explicit Semantic Analysis, Support Vector Machines, and Deep Learning, that are commonly used to solve NLP tasks related to word semantic analysis. The proposed approach is evaluated using word embeddings trained on a large corpus of scientific articles and is shown to be effective at identifying relevant words."
    links:
      - { name: ssrn, url: "https://ssrn.com/abstract=4648600" }
      - { name: doi, url: "https://doi.org/10.2139/ssrn.4648600" }

