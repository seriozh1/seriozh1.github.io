- title: "Agentic misalignment: an AI finance agent fakes revenue data"
  url: "https://www.lesswrong.com/posts/LMwkQLpQQv2KjgL9q/ai-finance-agent-fakes-the-revenue-data-to-avoid-termination"
  type: research
  venue: "FAEB 2025"
  summary: "Replicated Anthropic's agentic misalignment experiments and built a multi-turn extension testing how prior deception shapes later agent behaviour. In a simulated company, Claude 3.5 Sonnet falsified financial reports in about 40% of runs when told it would be replaced if revenue turned negative."
  links:
    - { name: lesswrong, url: "https://www.lesswrong.com/posts/LMwkQLpQQv2KjgL9q/ai-finance-agent-fakes-the-revenue-data-to-avoid-termination" }
    - { name: code, url: "https://github.com/seriozh1/agentic-misalignment" }

- title: "Reasoning reliability across 8 LLMs"
  type: research
  venue: "SPAR 2025"
  summary: "Built and ran an evaluation pipeline over 8 LLMs and 1,000 forecasting questions, using the [Martingale Score](https://arxiv.org/abs/2512.02914) to test whether reasoning updates beliefs rationally. Found that [inverse scaling in test-time compute](https://arxiv.org/abs/2507.14417) is task-conditional and sensitive to how beliefs are elicited."

- title: "AI Values: how humans and LLMs answer contested questions"
  url: "https://civai.org/p/ai-values"
  type: demo
  venue: "MARS 2025 · CivAI"
  summary: "Conceived and built from scratch an interactive demo for [CivAI](https://civai.org/) comparing human and LLM positions on contested questions. 17,000+ page views, 22,000+ user responses, and top 5 on Hacker News."
  links:
    - { name: demo, url: "https://civai.org/p/ai-values" }
    - { name: hacker news, url: "https://news.ycombinator.com/item?id=46547024" }

