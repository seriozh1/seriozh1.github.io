bio:
  - "I'm a founding Research Scientist at [Cedar Research](https://cedarresearch.org) and a doctoral researcher at the [University of Helsinki](https://www.helsinki.fi/en) (advised by [Prof. Giulio Jacucci](https://researchportal.helsinki.fi/en/persons/giulio-jacucci))."
  - "I work on AI character evaluation. As models gain autonomy and grow harder to monitor, their character becomes a key lever for safety. I measure the character and values of frontier models, test whether they predict misaligned behavior such as deception, and stress-test them under pressure."
  - "Previously: AI safety fellow at [SPAR](https://sparai.org/) and [MARS](https://www.cambridgeaisafety.org/mars), [ARENA](https://www.tutke.org/en/finnish-alignment-engineering-bootcamp) bootcamp, and 5+ years in production ML, most recently as founding AI engineer at [SMEY.AI](https://www.smey.cc/)."
  - "In my free time I train in calisthenics for competitions, swim (Candidate for Master of Sport), play chess and read science fiction and dystopias (my favorite is [Neuromancer](https://en.wikipedia.org/wiki/Neuromancer), as you might guess from this website's style)."
  - "Open to research collaborations. If you're working on something related, feel free to reach out."

